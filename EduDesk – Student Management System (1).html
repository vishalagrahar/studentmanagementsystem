<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduDesk – Student Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#17202f;--muted:#64748b;--line:#e2e8f0;--brand:#2457d6;--brandink:#fff;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--side:#0f1b33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1320;--card:#161e2e;--ink:#e8edf6;--muted:#94a3b8;--line:#27324a;--brand:#6c93ff;--brandink:#0b1430;--ok:#4ade80;--okbg:#14351f;--warn:#fbbf24;--warnbg:#3a2c0b;--bad:#f87171;--badbg:#3d1717;--side:#0a1020}}
:root[data-theme="dark"]{--bg:#0d1320;--card:#161e2e;--ink:#e8edf6;--muted:#94a3b8;--line:#27324a;--brand:#6c93ff;--brandink:#0b1430;--ok:#4ade80;--okbg:#14351f;--warn:#fbbf24;--warnbg:#3a2c0b;--bad:#f87171;--badbg:#3d1717;--side:#0a1020}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif}
.app{display:flex;min-height:100vh}
aside{width:220px;background:var(--side);color:#dbe4f5;padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;flex:none}
.brand{font-weight:800;font-size:22px;padding:4px 10px 14px;color:#fff}.brand i{font-style:normal;color:#7fa2ff}
aside button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:10px;font:600 14px inherit;cursor:pointer}
aside button:hover{background:#ffffff14}aside button.on{background:#2457d6;color:#fff}
aside .sp{flex:1}aside .small{font-size:12px;color:#93a3c4}
main{flex:1;min-width:0;padding:20px 22px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card small{color:var(--muted);display:block}.card b{font-size:28px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.panel h3{margin:0 0 10px;font-size:15px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.bar span:first-child{width:130px;flex:none}
.bar div{flex:1;background:var(--bg);border-radius:6px;height:12px;overflow:hidden}.bar div i{display:block;height:100%;background:var(--brand);border-radius:6px}
.bar b{width:28px;text-align:right}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.tools input[type=search]{flex:1 1 200px}
.btn{background:var(--brand);color:var(--brandink);border:0;border-radius:9px;padding:9px 14px;font:700 13px inherit;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:none;background:var(--bg)}
td small{display:block;color:var(--muted)}tr:last-child td{border-bottom:0}
.acts button{background:none;border:0;color:var(--brand);font:700 13px inherit;cursor:pointer;padding:4px 6px}.acts .del{color:var(--bad)}
.pill{padding:3px 9px;border-radius:999px;font:700 12px inherit}.ok{background:var(--okbg);color:var(--ok)}.mut{background:var(--bg);color:var(--muted)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:26px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;font:700 12px inherit;cursor:pointer}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button.P.on{background:var(--okbg);color:var(--ok)}.seg button.L.on{background:var(--warnbg);color:var(--warn)}.seg button.A.on{background:var(--badbg);color:var(--bad)}
td input[type=number]{width:70px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.box{background:var(--card);border-radius:16px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto}
.box h2{margin:0 0 12px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:12px;color:var(--muted)}.fg .full{grid-column:1/-1}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#ferr{color:var(--bad);margin-top:8px;font-weight:600}
textarea{width:100%;height:200px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px;font:12px monospace}
.hide{display:none!important}
@media (max-width:820px){.app{flex-direction:column}aside{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;align-items:center;padding:10px}.brand{padding:0 10px 0 4px}aside .sp,aside .small{display:none}aside button{white-space:nowrap}main{padding:14px}.fg{grid-template-columns:1fr}}
@media print{aside,header,#view{display:none}.modal{position:static;background:none;padding:0}.box{max-height:none}.noprint{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Edu<i>Desk</i></div>
    <button data-act="nav" data-v="dash">Dashboard</button>
    <button data-act="nav" data-v="stu">Students</button>
    <button data-act="nav" data-v="att">Attendance</button>
    <button data-act="nav" data-v="grd">Grades</button>
    <div class="sp"></div>
    <button data-act="reset">Reset demo data</button>
    <button data-act="clear">Clear all data</button>
    <div class="small">Data is saved in this browser only.</div>
  </aside>
  <main><header><h1 id="title"></h1><div id="actions"></div></header><section id="view"></section></main>
</div>
<div class="modal hide" id="modal"><div class="box" id="box"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUBJ=['Maths','Science','English','Computer','History'],COURSES=['Computer Science','Commerce','Arts','Mechanical','Business Admin'];
const today=()=>new Date().toISOString().slice(0,10);
function seed(){const N=['Aarav Sharma','Priya Singh','Rohan Verma','Ananya Gupta','Vikram Yadav','Sneha Mishra','Karan Patel','Neha Joshi','Aditya Rao','Pooja Nair','Rahul Das','Isha Kapoor'],st=[],gr={},at={};
  N.forEach((n,i)=>{const id='s'+(i+1);st.push({id,roll:'2026'+String(i+1).padStart(3,'0'),name:n,email:n.split(' ')[0].toLowerCase()+'@college.edu',phone:'98'+(10000000+Math.floor(Math.random()*89999999)),course:COURSES[i%5],year:1+i%4,status:i===10?'Inactive':'Active',joined:'2024-07-'+String(i+1).padStart(2,'0')});
    gr[id]={};SUBJ.forEach(s=>gr[id][s]=40+Math.floor(Math.random()*58))});
  for(let d=1;d<=12;d++){const dt=new Date(Date.now()-d*864e5);if(dt.getDay()%6===0)continue;const k=dt.toISOString().slice(0,10);at[k]={};st.forEach(s=>{const r=Math.random();at[k][s.id]=r<.82?'P':r<.92?'L':'A'})}
  return{students:st,grades:gr,att:at}}
let S;try{S=JSON.parse(localStorage.getItem('edudesk.v1'))}catch(e){}
if(!S||!S.students)S=seed();
const save=()=>{try{localStorage.setItem('edudesk.v1',JSON.stringify(S))}catch(e){}};
const pct=id=>{const g=S.grades[id]||{},v=SUBJ.filter(s=>g[s]!==''&&g[s]!=null);return v.length?Math.round(v.reduce((a,s)=>a+ +g[s],0)/v.length*10)/10:null};
const attPct=id=>{let a=0,t=0;for(const d in S.att){const v=S.att[d][id];if(v){t++;if(v!=='A')a++}}return t?Math.round(a/t*100):null};
const letter=p=>p==null?'—':p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':p>=50?'D':'F';
const lcls=l=>l==='A+'||l==='A'?'ok':l==='B'?'':l==='F'?'bad':l==='—'?'mut':'warn';
const pill=l=>`<span class="pill ${lcls(l)}">${l}</span>`;
let view='dash',F={q:'',course:'',status:''},AD=today();
const TT={dash:'Dashboard',stu:'Students',att:'Attendance',grd:'Grades and results'};

function vDash(){const A=S.students.filter(s=>s.status==='Active'),ps=S.students.map(s=>pct(s.id)).filter(x=>x!=null),avg=ps.length?Math.round(ps.reduce((a,b)=>a+b,0)/ps.length):0,
  ats=S.students.map(s=>attPct(s.id)).filter(x=>x!=null),aavg=ats.length?Math.round(ats.reduce((a,b)=>a+b,0)/ats.length):0;
  const byC=COURSES.map(c=>[c,S.students.filter(s=>s.course===c).length]),mx=Math.max(1,...byC.map(x=>x[1]));
  const gd=['A+','A','B','C','D','F'].map(l=>[l,S.students.filter(s=>letter(pct(s.id))===l).length]),gm=Math.max(1,...gd.map(x=>x[1]));
  const top=S.students.filter(s=>pct(s.id)!=null).sort((a,b)=>pct(b.id)-pct(a.id)).slice(0,5);
  const low=S.students.filter(s=>attPct(s.id)!=null&&attPct(s.id)<75);
  return `<div class="cards"><div class="card"><small>Total students</small><b>${S.students.length}</b></div><div class="card"><small>Active students</small><b>${A.length}</b></div><div class="card"><small>Average marks</small><b>${avg}%</b></div><div class="card"><small>Average attendance</small><b>${aavg}%</b></div></div>
  <div class="two"><div class="panel"><h3>Students by course</h3>${byC.map(([c,n])=>`<div class="bar"><span>${esc(c)}</span><div><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`).join('')}</div>
  <div class="panel"><h3>Grade distribution</h3>${gd.map(([l,n])=>`<div class="bar"><span>Grade ${l}</span><div><i style="width:${n/gm*100}%"></i></div><b>${n}</b></div>`).join('')}</div>
  <div class="panel"><h3>Top performers</h3>${top.length?top.map((s,i)=>`<div class="bar"><span>${i+1}. ${esc(s.name)}</span><b style="width:auto">${pct(s.id)}%</b></div>`).join(''):'<div class="empty">No grades yet</div>'}</div>
  <div class="panel"><h3>Low attendance (below 75%)</h3>${low.length?low.map(s=>`<div class="bar"><span>${esc(s.name)}</span><b style="width:auto"><span class="pill bad">${attPct(s.id)}%</span></b></div>`).join(''):'<div class="empty">Everyone is above 75%</div>'}</div></div>`}

const stuRows=()=>{const q=F.q.toLowerCase(),L=S.students.filter(s=>(!q||(s.name+s.roll+s.email).toLowerCase().includes(q))&&(!F.course||s.course===F.course)&&(!F.status||s.status===F.status));
  return L.length?L.map(s=>{const a=attPct(s.id),p=pct(s.id);return `<tr><td>${esc(s.roll)}</td><td><b>${esc(s.name)}</b><small>${esc(s.email)}</small></td><td>${esc(s.course)}<small>Year ${s.year}</small></td><td>${esc(s.phone)}</td><td>${a==null?'—':a+'%'}</td><td>${p==null?'—':p+'%'}</td><td><span class="pill ${s.status==='Active'?'ok':'mut'}">${s.status}</span></td><td class="acts"><button data-act="view" data-id="${s.id}">View</button><button data-act="edit" data-id="${s.id}">Edit</button><button class="del" data-act="del" data-id="${s.id}">Delete</button></td></tr>`}).join(''):'<tr><td colspan="8" class="empty">No students match your filters.</td></tr>'};
function vStu(){return `<div class="tools"><input type="search" id="q" placeholder="Search name, roll number or email" value="${esc(F.q)}" aria-label="Search students"><select id="fc" aria-label="Filter by course"><option value="">All courses</option>${COURSES.map(c=>`<option ${F.course===c?'selected':''}>${c}</option>`).join('')}</select><select id="fs" aria-label="Filter by status"><option value="">Any status</option><option ${F.status==='Active'?'selected':''}>Active</option><option ${F.status==='Inactive'?'selected':''}>Inactive</option></select></div>
  <div class="tw"><table><thead><tr><th>Roll no.</th><th>Student</th><th>Course</th><th>Phone</th><th>Attendance</th><th>Average</th><th>Status</th><th></th></tr></thead><tbody id="tb">${stuRows()}</tbody></table></div>`}

function vAtt(){const m=S.att[AD]||{},act=S.students.filter(s=>s.status==='Active'),c={P:0,L:0,A:0};act.forEach(s=>{if(m[s.id])c[m[s.id]]++});
  return `<div class="tools"><input type="date" id="ad" value="${AD}" aria-label="Attendance date"><button class="btn alt" data-act="allp">Mark all present</button></div>
  <div class="cards"><div class="card"><small>Present</small><b>${c.P}</b></div><div class="card"><small>Late</small><b>${c.L}</b></div><div class="card"><small>Absent</small><b>${c.A}</b></div><div class="card"><small>Not marked</small><b>${act.length-c.P-c.L-c.A}</b></div></div>
  <div class="tw"><table><thead><tr><th>Roll no.</th><th>Student</th><th>Overall</th><th>Mark for ${AD}</th></tr></thead><tbody>${act.map(s=>`<tr><td>${esc(s.roll)}</td><td><b>${esc(s.name)}</b><small>${esc(s.course)}</small></td><td>${attPct(s.id)==null?'—':attPct(s.id)+'%'}</td><td><div class="seg">${['P','L','A'].map(v=>`<button class="${v} ${m[s.id]===v?'on':''}" data-act="mark" data-id="${s.id}" data-v="${v}">${{P:'Present',L:'Late',A:'Absent'}[v]}</button>`).join('')}</div></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No active students.</td></tr>'}</tbody></table></div>`}

function vGrd(){return `<div class="tools"><span style="color:var(--muted)">Enter marks out of 100. Results update automatically.</span></div><div class="tw"><table><thead><tr><th>Student</th>${SUBJ.map(s=>`<th>${s}</th>`).join('')}<th>Average</th><th>Grade</th><th>Rank</th></tr></thead><tbody>${S.students.map(s=>`<tr><td><b>${esc(s.name)}</b><small>${esc(s.roll)}</small></td>${SUBJ.map(j=>`<td><input type="number" min="0" max="100" data-g="${s.id}|${j}" value="${(S.grades[s.id]||{})[j]??''}" aria-label="${esc(s.name)} ${j} marks"></td>`).join('')}<td data-c="${s.id}:p"></td><td data-c="${s.id}:g"></td><td data-c="${s.id}:r"></td></tr>`).join('')||`<tr><td colspan="9" class="empty">Add students first.</td></tr>`}</tbody></table></div>`}
function calc(){const rk=S.students.filter(s=>pct(s.id)!=null).sort((a,b)=>pct(b.id)-pct(a.id)).map(s=>s.id);
  S.students.forEach(s=>{const p=pct(s.id),set=(k,h)=>{const e=document.querySelector(`[data-c="${s.id}:${k}"]`);if(e)e.innerHTML=h};set('p',p==null?'—':p+'%');set('g',pill(letter(p)));set('r',rk.includes(s.id)?'#'+(rk.indexOf(s.id)+1):'—')})}

function render(){document.querySelectorAll('aside [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('#title').textContent=TT[view];
  $('#actions').innerHTML=view==='stu'?'<button class="btn alt" data-act="exp">Export CSV</button> <button class="btn" data-act="add">+ Add student</button>':view==='grd'?'<button class="btn alt" data-act="expg">Export CSV</button>':'';
  $('#view').innerHTML={dash:vDash,stu:vStu,att:vAtt,grd:vGrd}[view]();if(view==='grd')calc()}
const openM=h=>{$('#box').innerHTML=h;$('#modal').classList.remove('hide')},closeM=()=>$('#modal').classList.add('hide');
const ask=(msg,yes)=>{openM(`<h2>Please confirm</h2><p>${msg}</p><div class="row"><button class="btn alt" data-act="close">Cancel</button><button class="btn" id="yes">Yes, continue</button></div>`);$('#yes').onclick=()=>{closeM();yes()}};
function form(s){s=s||{};const o=(a,v)=>a.map(x=>`<option ${String(x)===String(v)?'selected':''}>${x}</option>`).join('');
  return `<h2>${s.id?'Edit student':'Add student'}</h2><form id="f" data-id="${s.id||''}"><div class="fg"><label class="full">Full name<input name="name" value="${esc(s.name)}" required></label><label>Roll number<input name="roll" value="${esc(s.roll)}" required></label><label>Joined on<input type="date" name="joined" value="${esc(s.joined||today())}"></label><label>Email<input name="email" type="email" value="${esc(s.email)}"></label><label>Phone<input name="phone" value="${esc(s.phone)}"></label><label>Course<select name="course">${o(COURSES,s.course)}</select></label><label>Year<select name="year">${o([1,2,3,4],s.year||1)}</select></label><label>Status<select name="status">${o(['Active','Inactive'],s.status||'Active')}</select></label></div><div id="ferr" role="alert"></div><div class="row"><button type="button" class="btn alt" data-act="close">Cancel</button><button class="btn" type="submit">Save student</button></div></form>`}
function saveStu(f){const d=Object.fromEntries(new FormData(f)),id=f.dataset.id,er=[];d.name=d.name.trim();d.roll=d.roll.trim();
  if(!d.name)er.push('Name is required');if(!d.roll)er.push('Roll number is required');
  if(S.students.some(s=>s.roll===d.roll&&s.id!==id))er.push('That roll number already exists');
  if(er.length){$('#ferr').textContent=er.join('. ');return}
  d.year=+d.year;if(id)Object.assign(S.students.find(s=>s.id===id),d);else{const n='s'+Date.now();S.students.push({id:n,...d});S.grades[n]={}}
  save();closeM();render()}
function profile(id){const s=S.students.find(x=>x.id===id),g=S.grades[id]||{},p=pct(id),L=letter(p),a=attPct(id);
  openM(`<h2>Report card</h2><p><b>${esc(s.name)}</b> · Roll ${esc(s.roll)}<br>${esc(s.course)}, Year ${s.year} · ${s.status}<br><small>${esc(s.email)} ${esc(s.phone)}</small></p>
  <table style="min-width:0"><thead><tr><th>Subject</th><th>Marks</th></tr></thead><tbody>${SUBJ.map(j=>`<tr><td>${j}</td><td>${g[j]===''||g[j]==null?'—':g[j]+' / 100'}</td></tr>`).join('')}</tbody></table>
  <p>Average: <b>${p==null?'—':p+'%'}</b> · Grade: ${pill(L)} · Attendance: <b>${a==null?'—':a+'%'}</b></p><div class="row noprint"><button class="btn alt" data-act="close">Close</button><button class="btn" onclick="window.print()">Print</button></div>`)}
const csv=rows=>rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
function showCsv(name,text){openM(`<h2>Export CSV</h2><textarea id="ta" readonly>${esc(text)}</textarea><div class="row"><button class="btn alt" data-act="close">Close</button><button class="btn alt" id="cp">Copy</button><button class="btn" id="dl">Download</button></div>`);
  $('#cp').onclick=()=>{$('#ta').select();try{navigator.clipboard.writeText(text)}catch(e){document.execCommand('copy')}};
  $('#dl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()}catch(e){}}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b){if(e.target.id==='modal')closeM();return}
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='nav'){view=b.dataset.v;render()}
  else if(a==='close')closeM();
  else if(a==='add')openM(form());
  else if(a==='edit')openM(form(S.students.find(s=>s.id===id)));
  else if(a==='view')profile(id);
  else if(a==='del'){const s=S.students.find(x=>x.id===id);ask(`Delete <b>${esc(s.name)}</b> and all their marks and attendance? This cannot be undone.`,()=>{S.students=S.students.filter(x=>x.id!==id);delete S.grades[id];for(const d in S.att)delete S.att[d][id];save();render()})}
  else if(a==='mark'){(S.att[AD]=S.att[AD]||{})[id]=b.dataset.v;save();render()}
  else if(a==='allp'){S.att[AD]=S.att[AD]||{};S.students.filter(s=>s.status==='Active').forEach(s=>S.att[AD][s.id]='P');save();render()}
  else if(a==='exp')showCsv('students.csv',csv([['Roll','Name','Email','Phone','Course','Year','Status','Attendance %','Average %']].concat(S.students.map(s=>[s.roll,s.name,s.email,s.phone,s.course,s.year,s.status,attPct(s.id),pct(s.id)]))));
  else if(a==='expg')showCsv('grades.csv',csv([['Roll','Name'].concat(SUBJ,['Average %','Grade'])].concat(S.students.map(s=>[s.roll,s.name].concat(SUBJ.map(j=>(S.grades[s.id]||{})[j]),[pct(s.id),letter(pct(s.id))])))));
  else if(a==='reset')ask('Replace everything with fresh demo data?',()=>{S=seed();save();render()});
  else if(a==='clear')ask('Delete ALL students, marks and attendance?',()=>{S={students:[],grades:{},att:{}};save();render()})});
document.addEventListener('submit',e=>{if(e.target.id==='f'){e.preventDefault();saveStu(e.target)}});
document.addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value;$('#tb').innerHTML=stuRows()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fc'){F.course=t.value;$('#tb').innerHTML=stuRows()}
  else if(t.id==='fs'){F.status=t.value;$('#tb').innerHTML=stuRows()}
  else if(t.id==='ad'&&t.value){AD=t.value;render()}
  else if(t.dataset.g){const[id,j]=t.dataset.g.split('|');let v=t.value===''?'':Math.max(0,Math.min(100,+t.value));t.value=v;(S.grades[id]=S.grades[id]||{})[j]=v;save();calc()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
render();
</script>
</body>
